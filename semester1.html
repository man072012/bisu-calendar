    pointer-events: none;

    z-index: 0;
  }

  .header {

  }
  .header::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 4px;
    background: linear-gradient(90deg, transparent, var(--vermillion), var(--gold), var(--vermillion), transparent);
  }
  .header::after {
    content: '';
    position: absolute;
    bottom: 0; left: 50%;

    width: 80%;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--ink-light), transparent);
  }

  .cloud-left, .cloud-right {

  .cloud-left { left: 5%; }
  .cloud-right { right: 5%; }

  .header-seal {

  .school-name-cn {

  .school-name-ar {

  .semester-title {

  .subtitle-line { font-size: 13px; color: var(--ink-light); }

  .nav-link {

    text-decoration: none; transition: all 0.3s;
  }
  .nav-link:hover { background: var(--jade); color: #fff; }

  .main-content { max-width: 1100px; margin: 0 auto; padding: 30px 20px 60px; position: relative; z-index: 1; }

    background: linear-gradient(180deg, var(--vermillion), var(--gold)); opacity: 0.6;
  }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }

  .month-header {
    display: flex; align-items: center; padding: 16px 24px;

    { name: "رأس السنة الميلادية 元旦", dates: "1 – 3 يناير (جمعة → أحد)", duration: "3 أيام إجازة", icon: "🎆", type: "holiday" },
    { name: "امتحانات نهاية الفصل 期末考试", dates: "11 – 15 يناير", duration: "5 أيام", icon: "📝", type: "exam" },
    { name: "العطلة الشتوية 寒假", dates: "18 يناير → 28 فبراير", duration: "42 يوماً", icon: "❄️", type: "summer" }
  ],
  "فبراير": [
    { name: "عيد الربيع الصيني 春节", dates: "6 فبراير (السبت)", duration: "ضمن العطلة الشتوية", icon: "🧧", type: "holiday" },
    { name: "العطلة الشتوية مستمرة 寒假", dates: "18 يناير → 28 فبراير", duration: "42 يوماً", icon: "❄️", type: "summer" }
  ]
};

function getEventClass(t) {
  return {holiday:'event-holiday',exam:'event-exam',register:'event-register',activity:'event-activity',notice:'event-notice'}[t]||'event-notice';
}

function renderCalendar() {
  const container = document.getElementById('calendar-container');
  let html = '';
  calData.months.forEach((month, mi) => {
    const holidays = holidaySummaries[month.nameAr] || [];
    let bHtml = '';
    if (holidays.length) {
      bHtml = '<div class="holiday-banners">';
      holidays.forEach(h => {
        bHtml += `<div class="holiday-banner type-${h.type}">
          <span class="banner-icon">${h.icon}</span>
          <span class="banner-name">${h.name}</span>
          <span class="banner-dates">${h.dates}</span>
          <span class="banner-duration">${h.duration}</span>
        </div>`;
      });
      bHtml += '</div>';
    }
    html += `<div class="month-card" style="animation-delay:${mi*0.06}s">
      <div class="month-header">
        <span class="month-name-ar">${month.nameAr}</span>
        <span class="month-name-cn">${month.nameCn}</span>
        <span class="month-name-detail">${month.detail}</span>
        <span class="month-weeks-badge">${month.weeks}</span>
      </div>${bHtml}
      <div class="table-scroll-wrapper"><table class="cal-table"><thead><tr>
        <th scope="col">الأسبوع</th><th scope="col">الاثنين</th><th scope="col">الثلاثاء</th><th scope="col">الأربعاء</th><th scope="col">الخميس</th><th scope="col">الجمعة</th><th scope="col">السبت</th><th scope="col">الأحد</th>
      </tr></thead><tbody>`;
    month.rows.forEach(row => {
      html += `<tr><td>${row.week}</td>`;
      row.days.forEach(day => {
        if (!day?.d) { html += '<td></td>'; }
        else {
          const ev = day.ev ? `<span class="day-event ${getEventClass(day.type)}">${day.ev}</span>` : '';
          html += `<td><span class="day-num">${day.d}</span>${ev}</td>`;
        }
      });
      html += '</tr>';
    });
    html += '</tbody></table></div></div>';
  });
  container.innerHTML = html;
  document.getElementById('notes-content').innerHTML = calData.notes.map(n => `<p>${n}</p>`).join('');
}

renderCalendar();
</script>
